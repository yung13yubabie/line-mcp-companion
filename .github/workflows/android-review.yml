name: Android review APK

on:
  pull_request:
  push:
    branches: [main, 'security/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install checksum-verified Java and Bun
        run: python3 scripts/ci-tools.py "$RUNNER_TEMP/lma-tools" --jdk
      - name: Check the hosted Android SDK
        run: |
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          command -v gpg
          command -v dpkg-deb
          command -v readelf
      - name: Install locked npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Gradle wrapper provenance
        run: printf '%s  %s\n' 'ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0' 'android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Prepare the signed, pinned native runtime
        run: |
          python3 test/native-runtime.test.py
          python3 scripts/node-android/native-runtime.py prepare --report "$RUNNER_TEMP/native-prepare.json"
      - name: Build a review APK without mock code
        run: |
          npm run bundle:android:release
          cd android
          ./gradlew --no-daemon --dependency-verification strict testReviewUnitTest assembleReview
      - name: Verify APK contents and signatures
        run: |
          mkdir -p review-apks
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("android/app/build/test-results/testReviewUnitTest").glob("TEST-*.xml"))
          assert reports, "No JVM test reports; NO-SOURCE is not acceptance"
          totals = {key: sum(int(ET.parse(p).getroot().get(key, "0")) for p in reports) for key in ("tests", "failures", "errors", "skipped")}
          assert totals["tests"] > 0 and all(totals[k] == 0 for k in ("failures", "errors", "skipped")), totals
          assert any(ET.parse(p).getroot().get("name") == "tw.linemcp.app.LocalMcpPresentationTest" and int(ET.parse(p).getroot().get("tests", "0")) > 0 for p in reports), "Missing or empty connection UI model suite"
          print("Actual local JVM results:", totals, "(not device/UI acceptance)")
          PYTEST
          cp android/app/build/test-results/testReviewUnitTest/TEST-*.xml review-apks/
          for abi in arm64-v8a x86_64; do
            apk="android/app/build/outputs/apk/review/app-$abi-review.apk"
            test -s "$apk"
            bash scripts/purge-mock-check.sh "$apk"
            python3 scripts/node-android/native-runtime.py verify-apk --apk "$apk" --report "review-apks/$abi-native-linkage.json"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 "$apk" > "review-apks/$abi-zipalign.txt"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "review-apks/$abi-signature.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "review-apks/$abi-package.txt"
            python3 scripts/review-apk.py inspect --build-tools "$ANDROID_HOME/build-tools/35.0.0" --apk "$apk" --report "review-apks/$abi-review-receipt.json"
            cp "$apk" "review-apks/line-mcp-companion-0.3.1-$abi-review.apk"
          done
          cp android/native-runtime.lock.json review-apks/
          cp "$RUNNER_TEMP/native-prepare.json" review-apks/native-prepare.json
          cp "$RUNNER_TEMP/lma-tools/provenance.json" review-apks/build-tools.json
          git rev-parse HEAD > review-apks/source-commit.txt
          sha256sum review-apks/*.apk > review-apks/SHA256SUMS
      - name: Publish review APKs as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: line-mcp-companion-review-${{ github.sha }}
          path: review-apks/
          if-no-files-found: error
          retention-days: 30
