name: Security checks

on:
  pull_request:
  push:
    branches: [main, 'security/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Network fixtures bind loopback and must not be forwarded through a proxy.
      NODE_USE_ENV_PROXY: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Run security and behavior regressions
        run: |
          mkdir -p review-results
          npm test 2>&1 | tee review-results/tests.tap
          npm run test:review 2>&1 | tee review-results/independent-review.tap
      - name: Audit npm dependency advisories
        run: npm audit --audit-level=high
      - name: Verify native supply chain and release gate regressions
        run: python3 test/native-runtime.test.py
      - name: Install verified Bun bundler
        run: python3 scripts/ci-tools.py "$RUNNER_TEMP/lma-tools"
      - name: Build and validate the release JavaScript bundle
        run: |
          npm run bundle:android:release
          sha256sum android/app/src/main/assets/nodeapp/main.mjs > review-results/bundle.sha256
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-checks-${{ github.sha }}
          path: review-results/
          if-no-files-found: error
          retention-days: 30
